name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for creating GitHub Release
      id-token: write   # for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify binary
        run: ./apps/cli/dist/index.js --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: |
          # Strip workspace:* deps from package.json before publishing
          cd apps/cli
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            // Remove workspace-only deps (they're bundled into dist)
            delete pkg.dependencies['@openwork/cloud'];
            delete pkg.dependencies['@openwork/core'];
            delete pkg.dependencies['@openwork/mcp'];
            delete pkg.dependencies['@openwork/tools'];
            // Point bin to dist
            pkg.bin = { 'ok-cli': 'dist/index.js' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/cli/dist/index.js
          generate_release_notes: true
